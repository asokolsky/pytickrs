[tools]
uv = 'latest'

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.venv]
description = "Set a virtual environment for the project"
# _.python.venv = { path = ".venv", create = true }
run = [
    'uv sync --group dev'
]

[tasks.pytickrs]
description = "Run pytickrs"
depends = ["venv"]
run = [
    'uv run python -m pytickrs'
]

[tasks.clean]
description = "Do local clean-up"
run = [
    'rm -rf .mypy_cache .ruff_cache .venv main.log',
    'find . -name __pycache__ | xargs rm -rf'
]

[tasks.format]
description = "Format python sources"
run = [
    # sort imports
    'uv run ruff check --select I --fix pytickrs tests',
    # reformat sources
    'uv run ruff format -v pytickrs tests',
]

[tasks.lint]
description = "Lint python sources"
run = [
    # check imports
    'uv run ruff check -v --select I pytickrs/*.py tests/*.py',
    'uv run ruff check -v pytickrs/*.py tests/*.py'
]

[tasks.mypy]
description = "Check typing"
run = [
    'uv run mypy pytickrs tests'
]

[tasks.tests]
description = "Execute unit tests"
run = [
    'uv run -m unittest -v tests/*_test.py',
]
